<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستر التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; animation: fadeIn 0.5s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navbar */
        nav {
            background: var(--secondary); color: white; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo { font-size: 1.4rem; font-weight: 900; color: #38bdf8; letter-spacing: 0.5px; }
        .nav-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }
        .btn-logout {
            background: var(--danger); color: white; border: none; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-logout:hover { opacity: 0.9; transform: scale(1.05); }

        /* Container */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* Auth Box */
        .auth-box {
            max-width: 420px; margin: 60px auto; background: var(--card);
            padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            text-align: center; border: 1px solid #e2e8f0;
        }
        .auth-box h2 { margin-bottom: 10px; color: var(--secondary); }
        .auth-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 1rem; outline: none; transition: 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-primary {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* Dashboard Header & Activation */
        .top-bar {
            background: var(--card); padding: 25px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 30px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px;
            border: 1px solid #e2e8f0;
        }
        .code-form { display: flex; gap: 10px; flex-wrap: wrap; }
        .code-form input {
            padding: 10px 15px; border: 2px solid #cbd5e1; border-radius: 8px;
            font-size: 1rem; width: 220px; text-transform: uppercase; font-weight: bold; outline: none; transition: 0.2s;
        }
        .code-form input:focus { border-color: var(--success); }
        .btn-activate {
            background: var(--success); color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-activate:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Lessons Grid */
        .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--secondary); }
        .lessons-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px;
        }
        .lesson-card {
            background: var(--card); border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s ease;
        }
        .lesson-card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .card-header { padding: 20px; background: linear-gradient(135deg, #1e293b, #334155); color: white; position: relative; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
            font-weight: 700; margin-bottom: 8px;
        }
        .badge-free { background: #22c55e; color: white; }
        .badge-paid { background: #f59e0b; color: white; }
        .badge-locked { background: #ef4444; color: white; }
        .card-body { padding: 20px; }
        .card-body p { color: var(--muted); font-size: 0.9rem; margin-bottom: 15px; }
        .card-footer { padding: 15px 20px; background: #f1f5f9; border-top: 1px solid #e2e8f0; }
        .btn-watch {
            width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700;
            cursor: pointer; background: var(--primary); color: white; transition: 0.2s;
        }
        .btn-watch:hover { background: var(--primary-dark); }
        .btn-quiz {
            width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700;
            cursor: pointer; background: var(--warning); color: white; transition: 0.2s;
        }
        .btn-quiz:hover { opacity: 0.9; }
        .btn-disabled {
            width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700;
            background: #cbd5e1; color: #475569; cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 750px; border-radius: 16px;
            padding: 25px; position: relative; max-height: 90vh; overflow-y: auto;
            animation: scaleUp 0.3s ease-in-out;
        }
        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-modal {
            position: absolute; top: 15px; left: 20px; font-size: 1.5rem; cursor: pointer;
            background: #f1f5f9; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: none; transition: 0.2s;
        }
        .close-modal:hover { background: #fee2e2; color: var(--danger); }
        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            border-radius: 12px; margin-top: 15px; background: #000;
        }
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .quiz-question { margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
        .quiz-question h4 { margin-bottom: 10px; }
        .quiz-option { display: block; margin-bottom: 8px; cursor: pointer; font-size: 0.95rem; }
        .alert { padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; font-size: 0.9rem; }
        .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .device-tag { font-size: 0.75rem; color: #334155; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div class="logo">🎓 منصة المستر التعليمية</div>
    <div class="nav-info" id="navInfo" style="display: none;">
        <span id="studentNameDisplay" style="font-weight: 700;"></span>
        <span class="device-tag" id="deviceIdDisplay"></span>
        <button class="btn-logout" onclick="logout()">خروج</button>
    </div>
</nav>

<!-- شاشة تسجيل الدخول -->
<div class="container" id="authSection">
    <div class="auth-box">
        <h2>تسجيل دخول الطلاب</h2>
        <p>الحساب مرتبط بجهاز واحد فقط لضمان أمان المحتوى</p>
        <div id="authAlert"></div>
        <div class="form-group">
            <label>اسم الطالب الثلاثي</label>
            <input type="text" id="studentName" placeholder="مثال: أحمد محمد علي">
        </div>
        <div class="form-group">
            <label>رقم الهاتف (اسم المستخدم)</label>
            <input type="tel" id="studentPhone" placeholder="010xxxxxxxx">
        </div>
        <button class="btn-primary" onclick="login()">دخول للمنصة</button>
        <p style="margin-top: 15px; font-size: 0.8rem; color: var(--muted);">* للدخول لوحة التحكم افتح ملف <b>admin.html</b></p>
    </div>
</div>

<!-- شاشة الطالب والمحاضرات -->
<div class="container" id="dashboardSection" style="display: none;">
    <div class="top-bar">
        <div>
            <h2 style="font-size: 1.3rem; color: var(--secondary);">أهلاً بك يا بطل 👋</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">معاك كود سنتر أو فودافون كاش؟ فعّله هنا لفتح المحاضرات المغلقة</p>
        </div>
        <div>
            <div class="code-form">
                <input type="text" id="voucherInput" placeholder="أدخل الكود (مثال: VIP-2026)">
                <button class="btn-activate" onclick="redeemCode()">تفعيل الكود</button>
            </div>
            <div id="codeAlert" style="margin-top: 8px;"></div>
        </div>
    </div>

    <h3 class="section-title">📚 المحاضرات والدروس المتاحة</h3>
    <div class="lessons-grid" id="lessonsContainer"></div>
</div>

<!-- نافذة عرض الفيديو أو الامتحان -->
<div class="modal" id="contentModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">×</button>
        <div id="modalBody"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
    function getOrCreateDeviceId() {
        let devId = localStorage.getItem('platform_device_id');
        if (!devId) {
            devId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem('platform_device_id', devId);
        }
        return devId;
    }

    const currentDeviceId = getOrCreateDeviceId();

    function login() {
        const name = document.getElementById('studentName').value.trim();
        const phone = document.getElementById('studentPhone').value.trim();
        const alertBox = document.getElementById('authAlert');

        if (!name || !phone) {
            alertBox.innerHTML = '<div class="alert alert-danger">يرجى إدخال الاسم ورقم الهاتف</div>';
            return;
        }

        let users = JSON.parse(localStorage.getItem('platform_users')) || {};

        if (users[phone]) {
            if (users[phone].deviceId && users[phone].deviceId !== currentDeviceId) {
                alertBox.innerHTML = `<div class="alert alert-danger">⛔ عفواً! هذا الحساب مسجل على جهاز آخر (${users[phone].deviceId}). تواصل مع الدعم الفني لفك القفل.</div>`;
                return;
            }
            if (!users[phone].deviceId) {
                users[phone].deviceId = currentDeviceId;
                localStorage.setItem('platform_users', JSON.stringify(users));
            }
        } else {
            users[phone] = {
                name: name,
                phone: phone,
                deviceId: currentDeviceId,
                unlockedLessons: [1],
                passedQuizzes: []
            };
            localStorage.setItem('platform_users', JSON.stringify(users));
        }

        localStorage.setItem('current_student_phone', phone);
        renderDashboard();
    }

    function logout() {
        localStorage.removeItem('current_student_phone');
        location.reload();
    }

    function redeemCode() {
        const codeInput = document.getElementById('voucherInput').value.trim().toUpperCase();
        const alertBox = document.getElementById('codeAlert');
        const phone = localStorage.getItem('current_student_phone');

        if (!codeInput) return;

        let codes = JSON.parse(localStorage.getItem('platform_codes')) || DEFAULT_CODES;
        let users = JSON.parse(localStorage.getItem('platform_users')) || {};
        let user = users[phone];

        const foundCode = codes.find(c => c.code === codeInput);

        if (!foundCode) {
            alertBox.innerHTML = '<span style="color:var(--danger); font-size:0.85rem; font-weight:bold;">❌ الكود غير صحيح!</span>';
            return;
        }
        if (foundCode.used) {
            alertBox.innerHTML = '<span style="color:var(--danger); font-size:0.85rem; font-weight:bold;">⚠️ هذا الكود تم استخدامه من قبل!</span>';
            return;
        }

        foundCode.used = true;
        foundCode.usedBy = phone;
        localStorage.setItem('platform_codes', JSON.stringify(codes));

        foundCode.unlocks.forEach(lessonId => {
            if (!user.unlockedLessons.includes(lessonId)) {
                user.unlockedLessons.push(lessonId);
            }
        });
        users[phone] = user;
        localStorage.setItem('platform_users', JSON.stringify(users));

        document.getElementById('voucherInput').value = '';
        alertBox.innerHTML = `<span style="color:var(--success); font-size:0.85rem; font-weight:bold;">✅ تم تفعيل (${foundCode.label}) بنجاح!</span>`;
        renderLessons();
    }

    function renderDashboard() {
        const phone = localStorage.getItem('current_student_phone');
        if (!phone) return;

        const users = JSON.parse(localStorage.getItem('platform_users')) || {};
        const user = users[phone];
        if (!user) { logout(); return; }

        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        document.getElementById('navInfo').style.display = 'flex';
        document.getElementById('studentNameDisplay').innerText = `الطالب: ${user.name}`;
        document.getElementById('deviceIdDisplay').innerText = `معرف جهازك: ${currentDeviceId}`;

        renderLessons();
    }

    function renderLessons() {
        const phone = localStorage.getItem('current_student_phone');
        const users = JSON.parse(localStorage.getItem('platform_users')) || {};
        const user = users[phone];
        const lessons = JSON.parse(localStorage.getItem('platform_lessons')) || DEFAULT_LESSONS;
        const container = document.getElementById('lessonsContainer');
        container.innerHTML = '';

        lessons.forEach(lesson => {
            const isPaidUnlocked = lesson.isFree || user.unlockedLessons.includes(lesson.id);
            const isQuizPassed = !lesson.requiredQuizId || user.passedQuizzes.includes(lesson.requiredQuizId);

            let badgeHtml = '';
            let buttonHtml = '';

            if (!isPaidUnlocked) {
                badgeHtml = '<span class="badge badge-paid">🔒 محتوى مدفوع (يتطلب كود)</span>';
                buttonHtml = `<button class="btn-disabled" onclick="alert('يرجى إدخال كود التفعيل في الأعلى لفتح هذه المحاضرة')">مغلق - أدخل الكود أولاً</button>`;
            } else if (!isQuizPassed) {
                badgeHtml = '<span class="badge badge-locked">📝 يتطلب اجتياز امتحان سابق</span>';
                buttonHtml = `<button class="btn-quiz" onclick="openQuiz(${lesson.requiredQuizId}, ${lesson.id})">ابدأ الامتحان لفتح المحاضرة</button>`;
            } else {
                badgeHtml = lesson.isFree ? '<span class="badge badge-free">مجاني</span>' : '<span class="badge badge-free">✅ مُفعّل بنجاح</span>';
                buttonHtml = `<button class="btn-watch" onclick="watchLesson(${lesson.id})">▶️ مشاهدة المحاضرة الآن</button>`;
            }

            container.innerHTML += `
                <div class="lesson-card">
                    <div>
                        <div class="card-header">
                            ${badgeHtml}
                            <h3 style="margin-top: 5px;">${lesson.title}</h3>
                        </div>
                        <div class="card-body">
                            <p>${lesson.description}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        ${buttonHtml}
                    </div>
                </div>
            `;
        });
    }

    function watchLesson(lessonId) {
        const lessons = JSON.parse(localStorage.getItem('platform_lessons')) || DEFAULT_LESSONS;
        const lesson = lessons.find(l => l.id === lessonId);
        const modalBody = document.getElementById('modalBody');

        modalBody.innerHTML = `
            <h3 style="color:var(--secondary);">${lesson.title}</h3>
            <p style="color:var(--muted); margin-bottom:10px; font-size:0.9rem;">${lesson.description}</p>
            <div class="video-wrapper">
                <iframe src="${lesson.videoUrl}" allowfullscreen></iframe>
            </div>
        `;
        document.getElementById('contentModal').style.display = 'flex';
    }

    function openQuiz(quizId, targetLessonId) {
        const quizzes = JSON.parse(localStorage.getItem('platform_quizzes')) || DEFAULT_QUIZZES;
        const quiz = quizzes.find(q => q.id === quizId);
        const modalBody = document.getElementById('modalBody');

        let html = `<h3 style="color:var(--secondary);">📝 ${quiz.title}</h3>
                    <p style="color:var(--muted); margin-bottom:20px; font-size:0.9rem;">يجب الحصول على ${quiz.passScore}% على الأقل لفتح المحاضرة التالية.</p>`;

        quiz.questions.forEach((q, idx) => {
            html += `<div class="quiz-question">
                        <h4>${idx + 1}. ${q.q}</h4>`;
            q.options.forEach((opt, optIdx) => {
                html += `<label class="quiz-option">
                            <input type="radio" name="q_${idx}" value="${optIdx}"> ${opt}
                         </label>`;
            });
            html += `</div>`;
        });

        html += `<button class="btn-primary" onclick="submitQuiz(${quiz.id})">تسليم الإجابات وعرض النتيجة</button>`;
        modalBody.innerHTML = html;
        document.getElementById('contentModal').style.display = 'flex';
    }

    function submitQuiz(quizId) {
        const quizzes = JSON.parse(localStorage.getItem('platform_quizzes')) || DEFAULT_QUIZZES;
        const quiz = quizzes.find(q => q.id === quizId);
        let correctCount = 0;

        quiz.questions.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            if (selected && parseInt(selected.value) === q.answer) {
                correctCount++;
            }
        });

        const scorePercent = Math.round((correctCount / quiz.questions.length) * 100);
        const modalBody = document.getElementById('modalBody');

        if (scorePercent >= quiz.passScore) {
            const phone = localStorage.getItem('current_student_phone');
            let users = JSON.parse(localStorage.getItem('platform_users')) || {};
            if (!users[phone].passedQuizzes.includes(quizId)) {
                users[phone].passedQuizzes.push(quizId);
                localStorage.setItem('platform_users', JSON.stringify(users));
            }
            modalBody.innerHTML = `
                <div style="text-align:center; padding: 30px;">
                    <h2 style="color:var(--success); margin-bottom:10px;">🎉 مبروك! نجحت في الامتحان</h2>
                    <p style="font-size:1.1rem; margin-bottom:20px;">درجتك: <b>${scorePercent}%</b> (${correctCount} من ${quiz.questions.length})</p>
                    <button class="btn-primary" onclick="closeModal(); renderLessons();">فتح المحاضرة الآن</button>
                </div>
            `;
        } else {
            modalBody.innerHTML = `
                <div style="text-align:center; padding: 30px;">
                    <h2 style="color:var(--danger); margin-bottom:10px;">❌ للأسف لم تجتز الامتحان</h2>
                    <p style="font-size:1.1rem; margin-bottom:20px;">درجتك: <b>${scorePercent}%</b> (المطلوب ${quiz.passScore}%)</p>
                    <button class="btn-quiz" onclick="openQuiz(${quizId})">إعادة المحاولة</button>
                </div>
            `;
        }
    }

    function closeModal() {
        document.getElementById('contentModal').style.display = 'none';
        document.getElementById('modalBody').innerHTML = '';
    }

    window.onload = function() {
        if (!localStorage.getItem('platform_codes')) {
            localStorage.setItem('platform_codes', JSON.stringify(DEFAULT_CODES));
        }
        renderDashboard();
    };
</script>
</body>
</html>
