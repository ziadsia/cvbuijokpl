<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستر التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; animation: fadeIn 0.4s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navbar */
        nav {
            background: var(--secondary); color: white; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo { font-size: 1.4rem; font-weight: 900; color: #38bdf8; }
        .nav-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }
        .btn-logout {
            background: var(--danger); color: white; border: none; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-logout:hover { opacity: 0.9; }

        /* Container */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* Auth Box (Login / Register Tabs) */
        .auth-box {
            max-width: 440px; margin: 40px auto; background: var(--card);
            padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab-btn {
            flex: 1; padding: 10px; background: none; border: none; font-size: 1rem;
            font-weight: 700; cursor: pointer; color: var(--muted); transition: 0.2s;
        }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px; }
        
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 1rem; outline: none; transition: 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-primary {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { background: var(--primary-dark); }

        /* Dashboard Header & Activation */
        .top-bar {
            background: var(--card); padding: 25px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 30px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px;
            border: 1px solid #e2e8f0;
        }
        .code-form { display: flex; gap: 10px; flex-wrap: wrap; }
        .code-form input {
            padding: 10px 15px; border: 2px solid #cbd5e1; border-radius: 8px;
            font-size: 1rem; width: 220px; text-transform: uppercase; font-weight: bold; outline: none;
        }
        .btn-activate {
            background: var(--success); color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-activate:hover { opacity: 0.9; }

        /* Lessons Grid */
        .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--secondary); }
        .lessons-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px;
        }
        .lesson-card {
            background: var(--card); border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s ease;
        }
        .lesson-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .card-header { padding: 20px; background: linear-gradient(135deg, #1e293b, #334155); color: white; position: relative; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
            font-weight: 700; margin-bottom: 8px;
        }
        .badge-free { background: #22c55e; color: white; }
        .badge-paid { background: #f59e0b; color: white; }
        .badge-locked { background: #ef4444; color: white; }
        .card-body { padding: 20px; }
        .card-body p { color: var(--muted); font-size: 0.9rem; margin-bottom: 15px; }
        .card-footer { padding: 15px 20px; background: #f1f5f9; border-top: 1px solid #e2e8f0; }
        .btn-watch { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; background: var(--primary); color: white; transition: 0.2s; }
        .btn-watch:hover { background: var(--primary-dark); }
        .btn-quiz { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; background: var(--warning); color: white; }
        .btn-disabled { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: 700; background: #cbd5e1; color: #475569; cursor: not-allowed; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 750px; border-radius: 16px;
            padding: 25px; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close-modal {
            position: absolute; top: 15px; left: 20px; font-size: 1.5rem; cursor: pointer;
            background: #f1f5f9; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: none;
        }
        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            border-radius: 12px; margin-top: 15px; background: #000;
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .quiz-question { margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
        .quiz-question h4 { margin-bottom: 10px; }
        .quiz-option { display: block; margin-bottom: 8px; cursor: pointer; font-size: 0.95rem; }
        .alert { padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; font-size: 0.9rem; }
        .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .device-tag { font-size: 0.75rem; color: #334155; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div class="logo">🎓 منصة المستر التعليمية</div>
    <div class="nav-info" id="navInfo" style="display: none;">
        <span id="studentNameDisplay" style="font-weight: 700;"></span>
        <span class="device-tag" id="deviceIdDisplay"></span>
        <button class="btn-logout" onclick="logout()">خروج</button>
    </div>
</nav>

<!-- شاشة تسجيل الدخول / إنشاء حساب -->
<div class="container" id="authSection">
    <div class="auth-box">
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('register')">حساب جديد</button>
        </div>

        <div id="authAlert"></div>

        <!-- فورم تسجيل الدخول -->
        <div id="loginForm">
            <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 20px;">ادخل برقم هاتفك وكلمة المرور الخاصة بك</p>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="loginPhone" placeholder="010xxxxxxxx">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">دخول للمنصة</button>
        </div>

        <!-- فورم إنشاء حساب جديد -->
        <div id="registerForm" style="display: none;">
            <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 20px;">أنشئ حساباً خاصاً بك (مرتبط بجهازك الثابت)</p>
            <div class="form-group">
                <label>اسم الطالب الثلاثي</label>
                <input type="text" id="regName" placeholder="أحمد محمد علي">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="regPhone" placeholder="010xxxxxxxx">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="regPass" placeholder="اختر كلمة مرور قوية">
            </div>
            <button class="btn-primary" onclick="register()">إنشاء الحساب والدخول</button>
        </div>

        <p style="margin-top: 20px; font-size: 0.8rem; text-align: center; color: var(--muted);">* لوحة تحكم المدرس: افتح <b>admin.html</b></p>
    </div>
</div>

<!-- لوحة الطالب -->
<div class="container" id="dashboardSection" style="display: none;">
    <div class="top-bar">
        <div>
            <h2 style="font-size: 1.3rem; color: var(--secondary);">أهلاً بك يا بطل 👋</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">معاك كود سنتر أو فودافون كاش؟ فعّله هنا لفتح المحاضرات</p>
        </div>
        <div>
            <div class="code-form">
                <input type="text" id="voucherInput" placeholder="أدخل الكود (مثال: VIP-2026)">
                <button class="btn-activate" onclick="redeemCode()">تفعيل الكود</button>
            </div>
            <div id="codeAlert" style="margin-top: 8px;"></div>
        </div>
    </div>

    <h3 class="section-title">📚 المحاضرات والدروس المتاحة</h3>
    <div class="lessons-grid" id="lessonsContainer"></div>
</div>

<!-- Modal -->
<div class="modal" id="contentModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">×</button>
        <div id="modalBody"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
    function switchTab(tab) {
        document.getElementById('authAlert').innerHTML = '';
        if(tab === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.remove('active');
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.remove('active');
        }
    }

    function getOrCreateDeviceId() {
        let devId = localStorage.getItem('platform_device_id');
        if (!devId) {
            devId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem('platform_device_id', devId);
        }
        return devId;
    }
    const currentDeviceId = getOrCreateDeviceId();

    function register() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        const alertBox = document.getElementById('authAlert');

        if(!name || !phone || !pass) {
            alertBox.innerHTML = '<div class="alert alert-danger">يرجى استكمال جميع البيانات</div>';
            return;
        }

        let users = JSON.parse(localStorage.getItem('platform_users')) || {};
        if(users[phone]) {
            alertBox.innerHTML = '<div class="alert alert-danger">رقم الهاتف هذا مسجل مسبقاً! قم بتسجيل الدخول</div>';
            return;
        }

        users[phone] = {
            name: name,
            phone: phone,
            pass: pass,
            deviceId: currentDeviceId,
            unlockedLessons: [1], // الحصة الأولى مفتوحة افتراضياً
            passedQuizzes: []
        };

        localStorage.setItem('platform_users', JSON.stringify(users));
        localStorage.setItem('current_student_phone', phone);
        renderDashboard();
    }

    function login() {
        const phone = document.getElementById('loginPhone').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const alertBox = document.getElementById('authAlert');

        let users = JSON.parse(localStorage.getItem('platform_users')) || {};

        if(!users[phone]) {
            alertBox.innerHTML = '<div class="alert alert-danger">رقم الهاتف غير مسجل! أنشئ حساباً جديداً</div>';
            return;
        }

        if(users[phone].pass !== pass) {
            alertBox.innerHTML = '<div class="alert alert-danger">كلمة المرور غير صحيحة</div>';
            return;
        }

        // قفل الجهاز
        if(users[phone].deviceId && users[phone].deviceId !== currentDeviceId) {
            alertBox.innerHTML = `<div class="alert alert-danger">⛔ هذا الحساب مسجل على جهاز آخر (${users[phone].deviceId}). تواصل مع الدعم لفك الحظر.</div>`;
            return;
        }
        if(!users[phone].deviceId) {
            users[phone].deviceId = currentDeviceId;
            localStorage.setItem('platform_users', JSON.stringify(users));
        }

        localStorage.setItem('current_student_phone', phone);
        renderDashboard();
    }

    function logout() {
        localStorage.removeItem('current_student_phone');
        location.reload();
    }

    function redeemCode() {
        const codeInput = document.getElementById('voucherInput').value.trim().toUpperCase();
        const alertBox = document.getElementById('codeAlert');
        const phone = localStorage.getItem('current_student_phone');
        if(!codeInput) return;

        let codes = JSON.parse(localStorage.getItem('platform_codes')) || DEFAULT_CODES;
        let users = JSON.parse(localStorage.getItem('platform_users')) || {};
        let user = users[phone];

        const foundCode = codes.find(c => c.code === codeInput);
        if(!foundCode) {
            alertBox.innerHTML = '<span style="color:var(--danger); font-size:0.85rem; font-weight:bold;">❌ الكود غير صحيح!</span>';
            return;
        }
        if(foundCode.used) {
            alertBox.innerHTML = '<span style="color:var(--danger); font-size:0.85rem; font-weight:bold;">⚠️ الكود مستخدم من قبل!</span>';
            return;
        }

        foundCode.used = true;
        foundCode.usedBy = phone;
        localStorage.setItem('platform_codes', JSON.stringify(codes));

        foundCode.unlocks.forEach(id => {
            if(!user.unlockedLessons.includes(id)) user.unlockedLessons.push(id);
        });
        users[phone] = user;
        localStorage.setItem('platform_users', JSON.stringify(users));

        document.getElementById('voucherInput').value = '';
        alertBox.innerHTML = `<span style="color:var(--success); font-size:0.85rem; font-weight:bold;">✅ تم تفعيل (${foundCode.label}) بنجاح!</span>`;
        renderLessons();
    }

    function renderDashboard() {
        const phone = localStorage.getItem('current_student_phone');
        if(!phone) return;
        let users = JSON.parse(localStorage.getItem('platform_users')) || {};
        let user = users[phone];
        if(!user) { logout(); return; }

        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        document.getElementById('navInfo').style.display = 'flex';
        document.getElementById('studentNameDisplay').innerText = `الطالب: ${user.name}`;
        document.getElementById('deviceIdDisplay').innerText = `الجهاز: ${currentDeviceId}`;

        renderLessons();
    }

    function renderLessons() {
        const phone = localStorage.getItem('current_student_phone');
        let users = JSON.parse(localStorage.getItem('platform_users')) || {};
        let user = users[phone];
        let lessons = JSON.parse(localStorage.getItem('platform_lessons')) || DEFAULT_LESSONS;
        const container = document.getElementById('lessonsContainer');
        container.innerHTML = '';

        if(lessons.length === 0) {
            container.innerHTML = '<p style="color:var(--muted);">لا توجد محاضرات مضافة حتى الآن من المدرس.</p>';
            return;
        }

        lessons.forEach(lesson => {
            const isUnlocked = lesson.isFree || user.unlockedLessons.includes(lesson.id);
            const isQuizPassed = !lesson.requiredQuizId || user.passedQuizzes.includes(lesson.requiredQuizId);

            let badge = '', btn = '';
            if(!isUnlocked) {
                badge = '<span class="badge badge-paid">🔒 مدفوع (يتطلب كود)</span>';
                btn = `<button class="btn-disabled" onclick="alert('أدخل كود التفعيل في الأعلى لفتح المحاضرة')">مغلق - أدخل الكود</button>`;
            } else if(!isQuizPassed) {
                badge = '<span class="badge badge-locked">📝 يتطلب امتحان سابق</span>';
                btn = `<button class="btn-quiz" onclick="openQuiz(${lesson.requiredQuizId}, ${lesson.id})">ابدأ الامتحان لفتح المحاضرة</button>`;
            } else {
                badge = lesson.isFree ? '<span class="badge badge-free">مجاني</span>' : '<span class="badge badge-free">✅ مُفعّل</span>';
                btn = `<button class="btn-watch" onclick="watchLesson(${lesson.id})">▶️ مشاهدة الحصة</button>`;
            }

            container.innerHTML += `
                <div class="lesson-card">
                    <div>
                        <div class="card-header">${badge}<h3 style="margin-top:5px;">${lesson.title}</h3></div>
                        <div class="card-body"><p>${lesson.description}</p></div>
                    </div>
                    <div class="card-footer">${btn}</div>
                </div>
            `;
        });
    }

    function watchLesson(id) {
        let lessons = JSON.parse(localStorage.getItem('platform_lessons')) || DEFAULT_LESSONS;
        let lesson = lessons.find(l => l.id === id);
        // تحويل رابط يوتيوب العادي إلى Embed لو المدرس دخله عادي
        let embedUrl = lesson.videoUrl;
        if(embedUrl.includes("watch?v=")) {
            embedUrl = embedUrl.replace("watch?v=", "embed/");
        } else if(embedUrl.includes("youtu.be/")) {
            embedUrl = embedUrl.replace("youtu.be/", "www.youtube.com/embed/");
        }

        document.getElementById('modalBody').innerHTML = `
            <h3>${lesson.title}</h3>
            <p style="color:var(--muted); margin-bottom:10px; font-size:0.9rem;">${lesson.description}</p>
            <div class="video-wrapper"><iframe src="${embedUrl}" allowfullscreen></iframe></div>
        `;
        document.getElementById('contentModal').style.display = 'flex';
    }

    function openQuiz(quizId) {
        let quizzes = JSON.parse(localStorage.getItem('platform_quizzes')) || DEFAULT_QUIZZES;
        let quiz = quizzes.find(q => q.id == quizId);
        if(!quiz) { alert('هذا الامتحان غير متوفر حالياً'); return; }

        let html = `<h3>📝 ${quiz.title}</h3><p style="color:var(--muted); margin-bottom:20px;">درجة النجاح المطلوبة: ${quiz.passScore}%</p>`;
        quiz.questions.forEach((q, idx) => {
            html += `<div class="quiz-question"><h4>${idx+1}. ${q.q}</h4>`;
            q.options.forEach((opt, optIdx) => {
                html += `<label class="quiz-option"><input type="radio" name="q_${idx}" value="${optIdx}"> ${opt}</label>`;
            });
            html += `</div>`;
        });
        html += `<button class="btn-primary" onclick="submitQuiz(${quiz.id})">تسليم الامتحان</button>`;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('contentModal').style.display = 'flex';
    }

    function submitQuiz(quizId) {
        let quizzes = JSON.parse(localStorage.getItem('platform_quizzes')) || DEFAULT_QUIZZES;
        let quiz = quizzes.find(q => q.id == quizId);
        let correct = 0;
        quiz.questions.forEach((q, idx) => {
            let sel = document.querySelector(`input[name="q_${idx}"]:checked`);
            if(sel && parseInt(sel.value) === q.answer) correct++;
        });

        let percent = Math.round((correct / quiz.questions.length) * 100);
        let modal = document.getElementById('modalBody');

        if(percent >= quiz.passScore) {
            let phone = localStorage.getItem('current_student_phone');
            let users = JSON.parse(localStorage.getItem('platform_users')) || {};
            if(!users[phone].passedQuizzes.includes(quizId)) {
                users[phone].passedQuizzes.push(quizId);
                localStorage.setItem('platform_users', JSON.stringify(users));
            }
            modal.innerHTML = `<div style="text-align:center; padding:20px;"><h2 style="color:var(--success);">🎉 مبروك نجحت!</h2><p>درجتك: ${percent}%</p><button class="btn-primary" onclick="closeModal(); renderLessons();">فتح المحاضرة</button></div>`;
        } else {
            modal.innerHTML = `<div style="text-align:center; padding:20px;"><h2 style="color:var(--danger);">❌ لم تجتز الامتحان</h2><p>درجتك: ${percent}% (المطلوب ${quiz.passScore}%)</p><button class="btn-quiz" onclick="openQuiz(${quizId})">إعادة المحاولة</button></div>`;
        }
    }

    function closeModal() { document.getElementById('contentModal').style.display = 'none'; }

    window.onload = function() {
        if(!localStorage.getItem('platform_codes')) localStorage.setItem('platform_codes', JSON.stringify(DEFAULT_CODES));
        if(!localStorage.getItem('platform_lessons')) localStorage.setItem('platform_lessons', JSON.stringify(DEFAULT_LESSONS));
        if(!localStorage.getItem('platform_quizzes')) localStorage.setItem('platform_quizzes', JSON.stringify(DEFAULT_QUIZZES));
        renderDashboard();
    };
</script>
</body>
</html>
